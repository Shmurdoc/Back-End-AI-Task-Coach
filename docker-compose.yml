services:
  webapi:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=AITaskCoach;User Id=sa;Password=${SA_PASSWORD:-YourStrong@Passw0rd};TrustServerCertificate=true;
      - OpenAI__ApiKey=${OPENAI_API_KEY}
      - OpenAI__Endpoint=${OPENAI_ENDPOINT:-https://api.openai.com/v1/chat/completions}
      - OpenAI__Model=${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      - sqlserver
    networks:
      - aitaskcoach-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD:-YourStrong@Passw0rd}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - aitaskcoach-network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - aitaskcoach-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./Doc/grafana/provisioning:/etc/grafana/provisioning
      - ./Doc/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - aitaskcoach-network

volumes:
  sqlserver_data:
  prometheus_data:
  grafana_data:

networks:
  aitaskcoach-network:
    driver: bridge
